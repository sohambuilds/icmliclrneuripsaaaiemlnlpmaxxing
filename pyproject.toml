[project]
name = "amc26"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anyascii>=0.3.3",
    "catboost>=1.2",
    "lightgbm>=4.5",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "polars>=1.44.2",
    "rapidfuzz>=3.14.6",
    "scikit-learn>=1.9.1",
    "sentence-transformers>=6.1.0",
    "sparse-dot-topn>=1.1",
    "torch>=2.11.0",
    "xgboost>=2.1",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyter-client>=8.10.0",
    "nbconvert>=7.17.1",
    "nbformat>=5.11.1",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
